<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">Cloud Inventory API architecture preview</title>
  <desc id="desc">A monochrome architecture diagram showing an HTTP client connected to a Flask API and a MongoDB product collection, with the four real product endpoints.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090909"/>
      <stop offset="1" stop-color="#171717"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#666"/>
      <stop offset="0.5" stop-color="#f4f4f0"/>
      <stop offset="1" stop-color="#666"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="750" fill="url(#background)"/>
  <g fill="none" stroke="#262626" stroke-width="1">
    <path d="M0 94h1200M0 188h1200M0 282h1200M0 376h1200M0 470h1200M0 564h1200M0 658h1200"/>
    <path d="M120 0v750M240 0v750M360 0v750M480 0v750M600 0v750M720 0v750M840 0v750M960 0v750M1080 0v750"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace">
    <text x="58" y="70" fill="#8d8d8d" font-size="18" letter-spacing="4">ACADEMIC CLOUD COMPUTING LAB</text>
    <text x="58" y="129" fill="#f5f5f2" font-size="45" font-weight="700">Inventory CRUD API</text>
    <text x="58" y="163" fill="#8d8d8d" font-size="18">Flask · PyMongo · MongoDB · single VM</text>
  </g>
  <g transform="translate(58 235)" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">
    <rect width="260" height="232" rx="24" fill="#101010" stroke="#3a3a3a"/>
    <circle cx="38" cy="38" r="7" fill="#f5f5f2"/>
    <text x="58" y="45" fill="#a0a0a0" font-size="15" letter-spacing="2">HTTP CLIENT</text>
    <g transform="translate(24 79)" font-size="15">
      <rect width="212" height="32" rx="16" fill="#ecece7"/>
      <text x="16" y="22" fill="#090909" font-weight="700">POST</text><text x="78" y="22" fill="#090909">/produk</text>
      <rect y="42" width="212" height="32" rx="16" fill="#1b1b1b" stroke="#343434"/>
      <text x="16" y="64" fill="#f5f5f2" font-weight="700">GET</text><text x="78" y="64" fill="#b7b7b7">/produk</text>
      <rect y="84" width="212" height="32" rx="16" fill="#1b1b1b" stroke="#343434"/>
      <text x="16" y="106" fill="#f5f5f2" font-weight="700">PUT</text><text x="78" y="106" fill="#b7b7b7">/produk/:id</text>
      <rect y="126" width="212" height="32" rx="16" fill="#1b1b1b" stroke="#343434"/>
      <text x="16" y="148" fill="#f5f5f2" font-weight="700">DELETE</text><text x="88" y="148" fill="#b7b7b7">/produk/:id</text>
    </g>
  </g>
  <path d="M338 351h132" stroke="url(#line)" stroke-width="2"/>
  <circle cx="404" cy="351" r="5" fill="#f5f5f2" filter="url(#softGlow)"/>
  <g transform="translate(470 264)" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">
    <rect width="260" height="174" rx="24" fill="#f1f1ed"/>
    <text x="28" y="45" fill="#111" font-size="14" letter-spacing="2">APPLICATION</text>
    <text x="28" y="96" fill="#090909" font-size="38" font-weight="700">Flask API</text>
    <text x="28" y="133" fill="#555" font-size="16">0.0.0.0:5000</text>
  </g>
  <path d="M730 351h132" stroke="url(#line)" stroke-width="2"/>
  <circle cx="796" cy="351" r="5" fill="#f5f5f2" filter="url(#softGlow)"/>
  <g transform="translate(862 235)" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">
    <rect width="280" height="232" rx="24" fill="#101010" stroke="#3a3a3a"/>
    <ellipse cx="140" cy="66" rx="70" ry="27" fill="#1b1b1b" stroke="#dadad5"/>
    <path d="M70 66v79c0 15 31 27 70 27s70-12 70-27V66M70 105c0 15 31 27 70 27s70-12 70-27" fill="none" stroke="#dadad5"/>
    <text x="140" y="201" fill="#f5f5f2" font-size="24" font-weight="700" text-anchor="middle">MongoDB</text>
    <text x="140" y="222" fill="#858585" font-size="14" text-anchor="middle">swalayanDB.produk</text>
  </g>
  <g transform="translate(58 567)" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">
    <rect width="1084" height="112" rx="22" fill="#111" stroke="#303030"/>
    <text x="26" y="38" fill="#858585" font-size="14" letter-spacing="2">DOCUMENT SHAPE</text>
    <text x="26" y="76" fill="#f5f5f2" font-size="20">{ Nama_Produk, Harga, Stok }</text>
    <text x="1058" y="76" fill="#858585" font-size="14" text-anchor="end">SOURCE: app.py + README</text>
  </g>
</svg>
